<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard - MiCRM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#2a2a2a",
                        "surface-container": "#1f1f1f",
                        "inverse-on-surface": "#303030",
                        "card-gradient-start": "#2A2A2E",
                        "surface": "#131313",
                        "card-gradient-end": "#101012",
                        "secondary": "#c8c6c8",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-primary": "#2f3131",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0e0e0e",
                        "on-background": "#e2e2e2",
                        "surface-tint": "#c6c6c7",
                        "surface-bright": "#393939",
                        "tertiary-container": "#e2e2e2",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "secondary-container": "#474649",
                        "on-secondary": "#303032",
                        "inverse-primary": "#5d5f5f",
                        "on-tertiary-fixed": "#1a1c1c",
                        "primary-container": "#e2e2e2",
                        "on-secondary-fixed-variant": "#474649",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-surface": "#e2e2e2",
                        "on-primary-container": "#636565",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "primary-fixed-dim": "#c6c6c7",
                        "background": "#131313",
                        "surface-dim": "#131313",
                        "text-muted": "#8E8E93",
                        "inverse-surface": "#e2e2e2",
                        "tertiary": "#ffffff",
                        "surface-container-low": "#1b1b1b",
                        "on-tertiary-container": "#636565",
                        "surface-variant": "#353535",
                        "on-primary-fixed-variant": "#454747",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-secondary-container": "#b7b4b7",
                        "surface-container-highest": "#353535",
                        "on-surface-variant": "#c4c7c8",
                        "primary": "#ffffff",
                        "secondary-fixed": "#e4e2e4",
                        "tertiary-fixed": "#e2e2e2",
                        "on-tertiary": "#2f3131",
                        "primary-fixed": "#e2e2e2",
                        "outline": "#8e9192",
                        "on-error-container": "#ffdad6",
                        "surface-secondary": "#141414",
                        "outline-variant": "#444748",
                        "on-primary-fixed": "#1a1c1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "24px",
                        "gutter": "16px",
                        "stack-overlap": "12px",
                        "section-gap": "40px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Geist"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "1.4", "letterSpacing": "0.03em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #000000; color: #ffffff; }
        .radial-gradient-card {
            background: radial-gradient(120% 120% at 50% -20%, #2A2A2E 0%, #101012 100%);
        }
        .chart-gradient {
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="font-body-md text-on-surface antialiased pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-margin py-4 w-full bg-background dark:bg-background docked full-width top-0 z-40 relative">
<div class="flex items-center gap-3">
<img alt="Avatar" class="w-10 h-10 rounded-full object-cover border border-white/10" data-alt="User profile picture of Jan in a dark, high-contrast style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTm93mgRH-2Vjig1hi1lt4yF2in-y3eR0OXORZAwKRWC7mnUofcSmEq7gsnpVLs3QaCS2tzVN0GOUH_81Q7fuCrsEVGPnOnWCVs5t6NAtp1KKBin6lh9tWz6z9docLRe4Haw-70f1menqIdzOWUPoejaVBSfpkWb_Ee7E21k16N0cIIHqWdAeoytdxo7gAGNEQoeEU3Bjlr7STyOHTflpo7cGCfAjk_cJZi5W8cgRTpC3jx90zj4cbBw"/>
<div>
<h1 class="text-on-surface font-headline-md text-headline-md-mobile font-bold tracking-tight">Hola, Jan</h1>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-secondary text-primary dark:text-tertiary hover:opacity-80 transition-opacity active:scale-95 duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">search</span>
</button>
</header>
<main class="px-container-margin flex flex-col gap-section-gap">
<!-- Cartera Section -->
<section>
<h2 class="text-text-muted font-label-md text-label-md mb-4 uppercase tracking-wider">Mi cartera</h2>
<!-- Swipeable Card Stack -->
<div class="relative h-[220px] w-full">
<!-- Secondary Card (Back) -->
<div class="absolute top-0 left-0 w-full h-[180px] radial-gradient-card rounded-[24px] p-6 flex flex-col justify-between translate-y-3 scale-95 opacity-80 z-0">
<div class="flex justify-between items-start">
<span class="font-label-sm text-label-sm tracking-widest text-text-muted uppercase">TOTAL VENTAS</span>
<div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10"></div>
</div>
<div>
<div class="font-headline-lg text-headline-lg-mobile text-white mb-1">$65,500</div>
<div class="font-label-sm text-label-sm text-text-muted">3 cerradas</div>
</div>
</div>
<!-- Primary Card (Front) -->
<div class="absolute top-0 left-0 w-full h-[200px] radial-gradient-card rounded-[24px] p-6 flex flex-col justify-between z-10 shadow-2xl border border-white/5">
<div class="flex justify-between items-start">
<span class="font-label-sm text-label-sm tracking-widest text-white uppercase opacity-90">TOTAL PROSPECTOS</span>
<div class="w-8 h-8 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center backdrop-blur-md"></div>
</div>
<div>
<div class="font-headline-lg text-headline-lg text-white mb-1 tracking-tight">$119,350</div>
<div class="font-label-sm text-label-sm text-text-muted">3 en seguimiento</div>
</div>
</div>
</div>
</section>
<!-- Chart Section -->
<section class="radial-gradient-card rounded-[24px] p-6 border border-white/5 relative overflow-hidden">
<div class="flex justify-between items-baseline mb-8 relative z-10">
<h3 class="font-headline-md text-[20px] font-bold text-white">Ingresos</h3>
<span class="font-label-sm text-label-sm text-text-muted">Últimos 6 meses</span>
</div>
<!-- Minimalist Chart Graphic -->
<div class="relative h-[120px] w-full flex items-end">
<!-- Grid Labels X-Axis -->
<div class="absolute bottom-0 left-0 w-full flex justify-between text-text-muted font-label-sm text-[10px] uppercase translate-y-6">
<span>Mar</span><span>Abr</span><span>May</span><span>Jun</span><span>Jul</span><span>Ago</span>
</div>
<!-- SVG Line Graph -->
<svg class="absolute bottom-0 w-full h-[100px] z-20 overflow-visible" preserveaspectratio="none" viewbox="0 0 100 100">
<path d="M0,90 Q20,90 40,90 T60,85 T80,40 T100,10" fill="none" stroke="white" stroke-width="2" vector-effect="non-scaling-stroke"></path>
<!-- Data points -->
<circle cx="0" cy="90" fill="white" r="2.5"></circle>
<circle cx="20" cy="90" fill="white" r="2.5"></circle>
<circle cx="40" cy="90" fill="white" r="2.5"></circle>
<circle cx="60" cy="85" fill="white" r="2.5"></circle>
<circle cx="80" cy="40" fill="white" r="2.5"></circle>
<circle cx="100" cy="10" fill="white" r="4"></circle>
</svg>
<!-- Gradient Fill under line -->
<svg class="absolute bottom-0 w-full h-[100px] z-10 opacity-40" preserveaspectratio="none" viewbox="0 0 100 100">
<defs>
<lineargradient id="chartFill" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="white" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="white" stop-opacity="0"></stop>
</lineargradient>
</defs>
<path d="M0,90 Q20,90 40,90 T60,85 T80,40 T100,10 L100,100 L0,100 Z" fill="url(#chartFill)"></path>
</svg>
</div>
<div class="h-6"></div> <!-- Spacer for x-axis labels -->
</section>
<!-- Resumen de Contactos -->
<section>
<h2 class="text-text-muted font-label-md text-label-md mb-4 font-semibold">Resumen de contactos</h2>
<div class="relative w-full pb-8">
<!-- Stacked list items -->
<div class="bg-surface-secondary rounded-[20px] p-5 flex justify-between items-center w-full z-0 relative border border-white/5 mb-[-12px]">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-text-muted"></div>
<span class="font-body-md text-body-md font-semibold text-white">Leads</span>
</div>
<span class="font-headline-md text-[18px] text-white">1</span>
</div>
<div class="bg-surface-secondary rounded-[20px] p-5 flex justify-between items-center w-full z-10 relative border border-white/5 mb-[-12px] shadow-[0_-4px_10px_rgba(0,0,0,0.5)]">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-text-muted"></div>
<span class="font-body-md text-body-md font-semibold text-white">Interesados</span>
</div>
<span class="font-headline-md text-[18px] text-white">1</span>
</div>
<div class="bg-surface-secondary rounded-[20px] p-5 flex justify-between items-center w-full z-20 relative border border-white/5 mb-[-12px] shadow-[0_-4px_10px_rgba(0,0,0,0.5)]">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-text-muted"></div>
<span class="font-body-md text-body-md font-semibold text-white">Seguimientos</span>
</div>
<span class="font-headline-md text-[18px] text-white">3</span>
</div>
<div class="bg-white rounded-[20px] p-5 flex justify-between items-center w-full z-30 relative shadow-[0_-8px_20px_rgba(0,0,0,0.8)]">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-black"></div>
<span class="font-body-md text-body-md font-bold text-black">Ventas</span>
</div>
<span class="font-headline-md text-[18px] text-black font-bold">3</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 flex justify-between items-center px-2 py-2 bg-black/80 backdrop-blur-xl rounded-full w-[90%] md:hidden border border-white/10 shadow-xl">
<a class="flex items-center gap-2 bg-primary dark:bg-tertiary text-on-primary dark:text-on-tertiary rounded-full px-6 py-3 transition-all duration-300 scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-label-md">Inicio</span>
</a>
<a class="flex items-center justify-center text-text-muted p-3 hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
</a>
<a class="flex items-center justify-center text-text-muted p-3 hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">check_box</span>
</a>
<a class="flex items-center justify-center text-text-muted p-3 hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</a>
</nav>
</body></html>
