<style>
        body {
            background-color: #000000; /* Pure black as requested in style guidance level 0 */
            color: var(--tw-colors-on-surface);
        }

        .interactive-card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: radial-gradient(circle at top left, #2A2A2E, #101012); /* Base Card Level 1 */
        }
        .interactive-card:active {
            transform: scale(0.98) translateY(2px);
        }
        
        /* Subtle modal/pill styling Level 2 */

            background-color: #000000;
            border: 1px solid rgba(255, 255, 255, 0.1);

<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-margin py-4 w-full sticky top-0 bg-black z-40">

</div>

<main class="px-container-margin mt-gutter flex flex-col gap-gutter">
<!-- Contact Groups List -->

</div>

</div>
<span class="material-symbols-outlined text-text-muted">chevron_right</span>
</div>

</div>
<span class="material-symbols-outlined text-text-muted">chevron_right</span>
</div>
<!-- Card 5: Ventas -->

<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-semibold mb-1">Ventas</span>

</div>
