name: Build & Release MiCRM

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: cd android && ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv android/app/build/outputs/apk/release/app-release.apk "MiCRM $VERSION.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: "MiCRM *.apk"

  create-release:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          files: |
            MiCRM *.apk
          body: |
            ## Notas de lanzamiento
            Lanzamiento automático de MiCRM.
            
            - Nueva versión: ${{ github.ref_name }}
            - Estilo Premium Dark inicializado.
            - Base de datos cifrada activa.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
