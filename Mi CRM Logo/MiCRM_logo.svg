<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="24%" r="85%">
      <stop offset="0%" stop-color="#3a3a3f"/>
      <stop offset="35%" stop-color="#1c1c1f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="382">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#c9cbd1"/>
      <stop offset="30%" stop-color="#5c5f66"/>
      <stop offset="46%" stop-color="#eef0f3"/>
      <stop offset="58%" stop-color="#54565c"/>
      <stop offset="74%" stop-color="#9a9ca2"/>
      <stop offset="88%" stop-color="#48494e"/>
      <stop offset="100%" stop-color="#d8d9dd"/>
    </linearGradient>

    <linearGradient id="extrude" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="382">
      <stop offset="0%" stop-color="#050506"/>
      <stop offset="100%" stop-color="#414247"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a5c62"/>
      <stop offset="50%" stop-color="#1a1a1c"/>
      <stop offset="100%" stop-color="#6a6c72"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="0"/>
    </clipPath>
  </defs>

  <!-- Fondo negro metalizado -->
  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#bgGrad)"/>

  <g clip-path="url(#roundedClip)">
    <!-- brillo especular superior (textura tipo metal cepillado) -->
    <ellipse cx="150" cy="70" rx="260" ry="110" fill="#ffffff" opacity="0.06" filter="url(#blurSoft)"/>
    <ellipse cx="420" cy="470" rx="220" ry="90" fill="#000000" opacity="0.35" filter="url(#blurSoft)"/>

    <!-- anillo metalico interior -->
    <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.6"/>

    <!-- Monograma M con efecto de extrusion 3D -->
    <g filter="url(#softShadow)">
      <!-- capas de extrusion (de atras hacia adelante) -->
      <text x="256" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="300" fill="url(#extrude)" transform="translate(9,11)">M</text>
      <text x="256" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="300" fill="url(#extrude)" transform="translate(7,9)">M</text>
      <text x="256" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="300" fill="url(#extrude)" transform="translate(5,7)">M</text>
      <text x="256" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="300" fill="url(#extrude)" transform="translate(3,5)">M</text>

      <!-- cara frontal cromada -->
      <text x="256" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="300" fill="url(#chrome)" stroke="#0a0a0b" stroke-width="1.5">M</text>
    </g>

    <!-- brillo especular sobre la letra -->
    <ellipse cx="220" cy="185" rx="150" ry="55" fill="#ffffff" opacity="0.30" filter="url(#blurSoft)"/>
  </g>

  <!-- borde exterior sutil -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="0" fill="none" stroke="#3a3a3f" stroke-width="1.5" opacity="0.7"/>
</svg>
